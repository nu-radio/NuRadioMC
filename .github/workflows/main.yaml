name: CI
# This workflow calls the unit tests & documentation workflows on push/pull request triggers.
# This mainly reduced the number of 'skipped' jobs showing up on pull requests from the base repo.

on:
  push:
  pull_request:

jobs:

  unit-tests:
    # Only run if the pull request does not originate from the base repo (= from a fork);
    # if it originates from a fork the tests will already be triggered by the 'push' event
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name }}
    uses: ./.github/workflows/run_tests.yaml
    with:
      python_version: "3.10"
      os: ubuntu-latest

  coverage:
    name: Combine coverage and report
    needs: unit-tests
    # Same condition as unit-tests: fork PRs get no coverage comment (no write access to post one anyway).
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read # needed to download the coverage artifacts uploaded by the test jobs above
      pull-requests: write
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download coverage data from all test jobs
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage and post/update report
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_COVERAGE_FILES: true

  docs:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name }}
    uses: ./.github/workflows/deploy_documentation.yaml

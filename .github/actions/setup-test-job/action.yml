name: 'Setup Test Job'
description: 'Checkout repo, install GSL, set up Python environment, and restore CI test data cache'

inputs:
  python-version:
    description: 'Python version to set up'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Display Github job network information
      shell: bash
      run: |
        curl -4 https://api.ipify.org
        echo

    - name: Setup GSL
      uses: ./.github/actions/setup-gsl

    - name: Setup Python Environment
      uses: ./.github/actions/setup-python-env
      with:
        python-version: ${{ inputs.python-version }}
        cache-key: ${{ runner.os }}-env-${{ inputs.python-version }}-${{ hashFiles('setup.py', 'pyproject.toml') }}-v3

    - name: Cache CI Data
      uses: ./.github/actions/cache-ci-data
      with:
        cache-key: ci-data-${{ github.job }}

name: 'Setup Python Environment'
description: 'Set up Python and restore cached environment'

inputs:
  python-version:
    description: 'Python version to set up'
    required: true
  cache-key:
    description: 'Cache key for Python environment'
    required: true
  restore-only:
    description: 'If true, only restore from cache (i.e. never saves/overwrites the cache)'
    default: true
  raise-deprecations:
    description: 'Turn deprecation warnings into errors'
    default: true

runs:
  using: 'composite'
  steps:
    - name: Set up Python [${{ inputs.python-version }}]
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'

    - name: Cache Python environment
      id: cache
      if: inputs.restore-only != 'true'
      uses: actions/cache@v5
      with:
        path: |
          ${{ env.pythonLocation }}
        key: ${{ inputs.cache-key }}

    - name: Cache Python environment (restore only)
      id: cache-restore
      if: inputs.restore-only == 'true'
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ env.pythonLocation }}
        key: ${{ inputs.cache-key }}

    - name: Install Python dependencies
      if: ${{ steps.cache.outputs.cache-hit != 'true' && steps.cache-restore.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest coverage
        pip install -e .[proposal,galacticnoise,cr_interpolator,minimizers]

    - name: Enable coverage measurement for subprocesses
      shell: bash
      run: |
        SITE_PACKAGES=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
        echo "import coverage; coverage.process_startup()" > "$SITE_PACKAGES/coverage_subprocess.pth"
        echo "COVERAGE_PROCESS_START=$GITHUB_WORKSPACE/pyproject.toml" >> "$GITHUB_ENV"

    - name: Display installed Python modules
      shell: bash
      run: |
        pip list

    - name: Raise errors from DeprecationWarning
      if: inputs.raise-deprecations
      shell: bash
      run: |
        echo "PYTHONWARNINGS=error::DeprecationWarning,ignore:invalid escape sequence:DeprecationWarning" >> "$GITHUB_ENV"
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: no-commit-to-branch
        name: branch is not 'develop' or 'master'
        args: [--branch, master, --branch, develop, --branch, new]
    -   id: check-added-large-files
        args: ['--maxkb=500']
-   repo: https://github.com/PyCQA/flake8
    rev: 7.1.2
    hooks:
    -   id: flake8
        args: [--count, --select=E9 F63 F7 F82, --show-source, --statistics]
-   repo: local
    hooks:
    -   id: check-ipynb-outputs
        name: check ipynb outputs
        language: python
        entry: python .github/git_hooks/check-ipynb-outputs.py
    -   id: black-changed-lines
        name: black (changed lines only)
        language: python
        additional_dependencies: [black==24.8.0]  # last version supporting Python 3.8
        entry: python .github/git_hooks/changed-lines.py format
        types: [python]
    -   id: flake8-changed-lines
        name: flake8 (all rules, changed lines only)
        language: python
        additional_dependencies: [flake8==7.1.2]
        entry: python .github/git_hooks/changed-lines.py lint
        types: [python]
        verbose: true  # the hook only warns: show its output although it passes

